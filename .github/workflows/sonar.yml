name: SonarCloud Analysis & AWS Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [ec2_instance_ready]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd 
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then 
            pip install --only-binary :all: --require-hashes -r requirements.txt
          fi

      - name: Run tests and generate coverage report
        run: |
         # Rulează testele și creează raportul necesar pentru Sonar
          python -m pytest --cov=. --cov-report=xml
          
         # Fix absolute paths for SonarCloud Docker container
          sed -i 's@/home/runner/work/socially-backend-ai/socially-backend-ai@/github/workspace@g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4b0bfc149f5e285930eeb5e917327e66660c6e92
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
        # Îi spunem extensiei unde să găsească fișierul generat la pasul anterior
          args: >
            -Dsonar.projectKey=socially-backend-ai
            -Dsonar.organization=fii-a5-ip
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=api
            -Dsonar.tests=tests
            
  build-and-deploy:
    needs: build-and-analyze # Regula logica: Asteapta terminarea cu succes a Job-ului 1
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: proiect-backend-api 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user 
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Autentificare ECR pe serverul EC2
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # 2. Tragerea celei mai noi imagini din depozit
            docker pull ${{ steps.login-ecr.outputs.registry }}/proiect-backend-api:latest
            
            # 3. Setarea la environment variables in OS
            mkdir -p ~/app
            cd ~/app

            # Creare retea daca nu exista
            docker network create retea-proiect || true

            # --- DEPLOY REDIS ---
            docker stop redis-cache || true
            docker rm redis-cache || true
            docker pull redis:7.2-alpine
            docker run -d --name redis-cache --network retea-proiect --restart unless-stopped redis:7.2-alpine --appendonly yes

            echo 'GEOAPIFY_AUTOCOMPLETE_API_KEY=${{ secrets.GEOAPIFY_AUTOCOMPLETE_API_KEY }}' > .env
            echo 'GEOAPIFY_DISTANCE_API_KEY=${{ secrets.GEOAPIFY_DISTANCE_API_KEY }}' >> .env
            echo 'GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}' >> .env
            echo 'GROQ_API_KEY_1=${{ secrets.GROQ_API_KEY_1 }}' >> .env
            echo 'GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}' >> .env
            echo 'GROQ_API_KEY_3=${{ secrets.GROQ_API_KEY_3 }}' >> .env
            echo 'DB_HOST=${{ secrets.DB_HOST }}' >> .env
            echo 'DB_PORT=${{ secrets.DB_PORT }}' >> .env
            echo 'DB_USER=${{ secrets.DB_USER }}' >> .env
            echo 'DB_PASS=${{ secrets.DB_PASS }}' >> .env
            echo 'DB_NAME=${{ secrets.DB_NAME }}' >> .env
            echo 'REDIS_URL=redis://redis-cache:6379/0' >> .env

            # 4. Oprirea si stergerea containerului vechi (pentru a evita erori de tipul "numele e deja folosit")
            docker stop backend-ai || true
            docker rm backend-ai || true
            
            # 5. Pornirea noului container cu expunerea portului
            # --- DEPLOY BACKEND ---
            docker run -d --name backend-ai --env-file .env --network retea-proiect --restart unless-stopped -p 5000:5000 ${{ steps.login-ecr.outputs.registry }}/proiect-backend-api:latest


