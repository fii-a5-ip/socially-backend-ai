name: SonarCloud Analysis & AWS Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: [ec2_instance_ready]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd 
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then 
            pip install --only-binary :all: --require-hashes -r requirements.txt
          fi

      - name: Run tests and generate coverage report
        run: |
         # Rulează testele și creează raportul necesar pentru Sonar
          python -m pytest --cov=. --cov-report=xml
          
         # Fix absolute paths for SonarCloud Docker container
          sed -i 's@/home/runner/work/socially-backend-ai/socially-backend-ai@/github/workspace@g' coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4b0bfc149f5e285930eeb5e917327e66660c6e92
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
        # Îi spunem extensiei unde să găsească fișierul generat la pasul anterior
          args: >
            -Dsonar.projectKey=socially-backend-ai
            -Dsonar.organization=fii-a5-ip
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=api
            -Dsonar.tests=tests
            
  build-and-deploy:
    needs: build-and-analyze # Regula logica: Asteapta terminarea cu succes a Job-ului 1
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: proiect-backend-api 
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Trigger ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name flask-auto-scaling \
            --region eu-west-1 \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}'
